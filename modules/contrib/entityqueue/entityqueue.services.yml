services:
  plugin.manager.entityqueue.handler:
    class: Drupal\entityqueue\EntityQueueHandlerManager
    arguments: ['@container.namespaces', '@cache.default', '@module_handler']
  entityqueue.route_subscriber:
    class: Drupal\entityqueue\Routing\RouteSubscriber
    arguments: ['@entity_type.manager']
    tags:
      - { name: event_subscriber }
  entityqueue.repository:
    class: Drupal\entityqueue\EntityQueueRepository
    arguments: ['@entity_type.manager']
  entityqueue.subqueue_route_processor:
    class: Drupal\entityqueue\RouteProcessor\EntitySubqueueRouteProcessor
    arguments: ['@entity_type.manager']
    tags:
      - { name: route_processor_outbound }
  Drupal\entityqueue\Hook\EntityqueueHooks:
    class: Drupal\entityqueue\Hook\EntityqueueHooks
    arguments: ['@module_handler', '@entity_type.manager', '@current_route_match', '@plugin.manager.menu.local_task']
  Drupal\entityqueue\Hook\EntityqueueViewsHooks:
    class: Drupal\entityqueue\Hook\EntityqueueViewsHooks
    arguments: ['@entity_type.manager', '@entity_field.manager']
